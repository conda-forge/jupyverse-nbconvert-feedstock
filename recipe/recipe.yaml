schema_version: 1

context:
  version: "0.1.2"

package:
  name: jupyverse-nbconvert
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/j/jupyverse-nbconvert/jupyverse_nbconvert-${{ version }}.tar.gz
    sha256: 0f8a7ce5771b60605664ec40c1ec90f288ddf4f0674b7e0d6a670a088c016227

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.32,<0.12
  run:
    - python >=${{ python_min }}
    - fastapi-core
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0

tests:
  - python:
      imports: jupyverse_nbconvert
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/api/nbconvert
  summary: The API for Jupyverse's nbconvert.

extra:
  recipe-maintainers:
    - davidbrochart
